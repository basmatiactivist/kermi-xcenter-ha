name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install test dependencies (pinned)
        run: python -m pip install -r requirements-test.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy --strict)
        run: mypy
      - name: Tests with coverage (offline, local fake x-center only)
        run: python -m pytest -q --cov=custom_components/kermi_xcenter --cov-report=term --cov-fail-under=90
