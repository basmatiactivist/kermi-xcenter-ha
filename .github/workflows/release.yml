name: Release check

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match manifest.json version
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/kermi_xcenter/manifest.json'))['version'])")
          echo "tag=${TAG} manifest=${manifest}"
          if [ "${TAG#v}" != "${manifest}" ]; then
            echo "::error::Tag ${TAG} does not match manifest version ${manifest}"
            exit 1
          fi
