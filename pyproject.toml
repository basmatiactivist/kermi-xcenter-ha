[project]
name = "kermi-xcenter-ha"
version = "0.1.2"
description = "Read-only Home Assistant integration for the Kermi x-center"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "N", "D"]
ignore = ["D203", "D213", "PLR0913", "PLR2004", "D105", "D107", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "D103", "RUF001"]
"tests/*" = ["D", "PLR2004", "PLC0415", "PLR0912", "SLF001"]
